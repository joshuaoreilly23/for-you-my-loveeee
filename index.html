<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You My Love</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .message {
            position: fixed;
            bottom: 35px;
            width: 100%;
            text-align: center;
            color: rgba(255, 100, 150, 0.9);
            font-family: Georgia, serif;
            font-size: 25px;
            font-style: italic;
            opacity: 0;
            animation: appear 3s ease forwards;
            animation-delay: 5s;
        }

        @keyframes appear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<canvas id="heart"></canvas>

<div class="message">
    For you my love
</div>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = canvas.width = window.innerWidth * devicePixelRatio;
    height = canvas.height = window.innerHeight * devicePixelRatio;

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        window.innerWidth / 2,
        window.innerHeight / 2
    );
}

resize();

window.addEventListener("resize", resize);


function heart(a, scale) {

    const x =
        16 *
        Math.pow(Math.sin(a), 3) *
        scale;

    const y =
    -(
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a)
    ) * scale

    return {
        x: x,
        y: y
    };
}


const particles = [];


/* FIRST PARTICLE LAYER */

for (let i = 0; i < 10000; i++) {

    const a = Math.random() * Math.PI * 2;
    const scale = 0.5 + Math.random() * 15;

    const point = heart(a, scale);

    const angle =
        Math.atan2(point.y, point.x) +
        (Math.random() - 0.5);

    const length =
        4 + Math.random() * 10;

    particles.push({
        x: point.x,
        y: point.y,
        length: length,
        angle: angle,
        alpha: 0.25 + Math.random() * 0.35,
        width: 0.5 + Math.random() * 0.7
    });
}


/* SECOND PARTICLE LAYER */

for (let i = 0; i < 3500; i++) {

    const a = Math.random() * Math.PI * 2;
    const point = heart(a, 16.9);

    const angle =
        Math.atan2(point.y, point.x) +
        (Math.random() - 0.5) * 0.7;

    const length =
        10 + Math.random() * 22;

    particles.push({
        x: point.x + (Math.random() - 0.5) * 4,
        y: point.y + (Math.random() - 0.5) * 4,
        length: length,
        angle: angle,
        alpha: 0.45 + Math.random() * 0.5,
        width: 0.4 + Math.random() * 0.5
    });
}


/* DRAW */

function draw() {

    ctx.clearRect(
        -window.innerWidth / 2,
        -window.innerHeight / 2,
        window.innerWidth,
        window.innerHeight
    );

    for (const p of particles) {

        const endX =
            p.x + p.length * Math.cos(p.angle);

        const endY =
            p.y + p.length * Math.sin(p.angle);

        ctx.beginPath();

        ctx.moveTo(p.x, p.y);

        ctx.lineTo(endX, endY);

        ctx.strokeStyle =
            `rgba(255, ${Math.floor(60 + p.alpha * 100)}, ${Math.floor(120 + p.alpha * 120)}, ${p.alpha})`;

        ctx.lineWidth = p.width;

        ctx.stroke();
    }

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
