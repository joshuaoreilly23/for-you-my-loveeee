<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You My Love</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .message {
            position: fixed;
            bottom: 35px;
            left: 0;
            width: 100%;

            text-align: center;

            color: rgba(255, 100, 150, 0.9);

            font-family: Georgia, serif;
            font-size: clamp(20px, 5vw, 30px);
            font-style: italic;

            opacity: 0;

            animation: appear 3s ease forwards;
            animation-delay: 5s;
        }

        @keyframes appear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

<canvas id="heart"></canvas>

<div class="message">
    For you my love
</div>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let width;
let height;
let scaleFactor = 1;

let particles = [];


/* SCREEN SIZE */

function resize() {

    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    /*
        Original Turtle window was 700 x 700.
        Scale the heart so it fits the screen.
    */

    scaleFactor = Math.min(width, height) / 700;
}


/* ORIGINAL HEART */

function heart(a, scale) {

    const x =
        16 *
        Math.pow(Math.sin(a), 3) *
        scale;

    const y =
        -(
            13 * Math.cos(a)
            - 5 * Math.cos(2 * a)
            - 2 * Math.cos(3 * a)
            - Math.cos(4 * a)
        ) * scale;

    return {
        x: x,
        y: y
    };
}


/* CREATE PARTICLES */

function createParticles() {

    particles = [];


    /*
        FIRST LAYER
        Same style as the original Python.
    */

    for (let i = 0; i < 10000; i++) {

        const a =
            Math.random() *
            Math.PI *
            2;

        const sc =
            0.5 +
            Math.random() * 15.5;

        const point =
            heart(
                a,
                sc * scaleFactor
            );


        const angle =
            Math.atan2(
                point.y,
                point.x
            ) +
            (Math.random() - 0.5);


        const length =
            (4 + Math.random() * 10) *
            scaleFactor;


        particles.push({

            x: point.x,

            y: point.y,

            length: length,

            angle: angle,

            alpha:
                0.25 +
                Math.random() * 0.30,

            width:
                0.5 +
                Math.random() * 0.7
        });
    }


    /*
        SECOND LAYER
    */

    for (let i = 0; i < 3500; i++) {

        const a =
            Math.random() *
            Math.PI *
            2;


        const point =
            heart(
                a,
                16.9 * scaleFactor
            );


        const angle =
            Math.atan2(
                point.y,
                point.x
            ) +
            (Math.random() - 0.5) * 0.7;


        const length =
            (10 + Math.random() * 22) *
            scaleFactor;


        particles.push({

            x:
                point.x +
                (Math.random() - 0.5) *
                4 *
                scaleFactor,

            y:
                point.y +
                (Math.random() - 0.5) *
                4 *
                scaleFactor,

            length:
                length,

            angle:
                angle,

            alpha:
                0.45 +
                Math.random() * 0.5,

            width:
                0.4 +
                Math.random() * 0.5
        });
    }
}


/* INITIAL SETUP */

resize();

createParticles();


/* REDRAW PARTICLES WHEN SCREEN CHANGES */

window.addEventListener(
    "resize",
    function() {

        resize();

        createParticles();
    }
);


/* DRAW HEART */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Move the origin to the exact
        centre of the screen.
    */

    const centerX =
        width / 2;

    const centerY =
        height / 2;


    for (const p of particles) {

        const endX =
            p.x +
            p.length *
            Math.cos(p.angle);


        const endY =
            p.y +
            p.length *
            Math.sin(p.angle);


        ctx.beginPath();


        ctx.moveTo(
            p.x + centerX,
            p.y + centerY
        );


        ctx.lineTo(
            endX + centerX,
            endY + centerY
        );


        ctx.strokeStyle =
            `rgba(
                255,
                ${Math.floor(
                    60 + p.alpha * 100
                )},
                ${Math.floor(
                    120 + p.alpha * 120
                )},
                ${p.alpha}
            )`;


        ctx.lineWidth =
            p.width;


        ctx.stroke();
    }


    requestAnimationFrame(draw);
}


draw();

</script>

</body>
</html>
